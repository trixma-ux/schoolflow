name: school_flow
description: Application de gestion scolaire complète.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.3
  
  # Navigation
  go_router: ^12.1.1
  
  # UI & Design
  google_fonts: ^6.1.0
  phosphor_flutter: ^2.0.0
  intl: ^0.18.1
  
  # Firebase Core (Versions majeures Web / WASM Ready)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  
  # Utility
  equatable: ^2.0.5
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
